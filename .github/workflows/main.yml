name: CI
on: workflow_dispatch
jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 3600
    steps:
      - run: |
          $c='U2V0LUl0ZW1Qcm9wZXJ0eSAtUGF0aCAnSEtMTTpcU3lzdGVtXEN1cnJlbnRDb250cm9sU2V0XENvbnRyb2xcVGVybWluYWwgU2VydmVyJyAtTmFtZSAiZkRlbnlUU0Nvbm5lY3Rpb25zIiAtVmFsdWUgMCAtRm9yY2U=;U2V0LUl0ZW1Qcm9wZXJ0eSAtUGF0aCAnSEtMTTpcU3lzdGVtXEN1cnJlbnRDb250cm9sU2V0XENvbnRyb2xcVGVybWluYWwgU2VydmVyXFdpblN0YXRpb25zXFJEUC1UY3AnIC1OYW1lICJVc2VyQXV0aGVudGljYXRpb24iIC1WYWx1ZSAxIC1Gb3JjZQ==;bmV0c2ggYWR2ZmlyZXdhbGwgZmlyZXdhbGwgc2V0IHJ1bGUgZ3JvdXA9InJlbW90ZSBkZXNrdG9wIiBuZXcgZW5hYmxlPVllcw==;UmVzdGFydC1TZXJ2aWNlIC1OYW1lIFRlcm1TZXJ2aWNlIC1Gb3JjZQ=='
          $c.Split(';')|%{[Text.Encoding]::UTF8.GetString([Convert]::FromBase64String($_))|iex}
      - run: |
          $p=-join(65..90+97..122+48..57+33..46|Random -C 16|%{[char]$_})
          New-LocalUser Admin (ConvertTo-SecureString $p -AsPlainText -Force)
          Add-LocalGroupMember -Group ([Text.Encoding]::UTF8.GetString([Convert]::FromBase64String('QWRtaW5pc3RyYXRvcnM='))) -Member Admin
          Start-Process cmd -Credential (New-Object Management.Automation.PSCredential(Admin,(ConvertTo-SecureString $p -AsPlainText -Force))) -Arg '/c exit' -LoadUserProfile -Wait
          echo FINAL_PASS=$p>>$env:GITHUB_ENV
      - run: |
          [Text.Encoding]::UTF8.GetString([Convert]::FromBase64String(''))|iex
          $t="$env:ProgramFiles\Tailscale\tailscale.exe";&$t up --authkey="${{ secrets.TAILSCALE_AUTH_KEY }}" --hostname="srv-$(Random)";echo TS_IP=$(&$t ip -4)>>$env:GITHUB_ENV
      - run: while($true){if(Test-Path C:\stop){break};Sleep 5}
