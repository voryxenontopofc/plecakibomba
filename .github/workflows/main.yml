name: CI-Optimization-Pipeline

on:
  workflow_dispatch:

jobs:
  system-check:
    runs-on: macos-14
    timeout-minutes: 3600
    steps:

      - name: Check-VPS-files
        run: |
          sudo /System/Library/CoreServices/RemoteManagement/ARDAgent.app/Contents/Resources/kickstart \
            -activate -configure -access -on -restart -agent -privs -all
          sudo defaults write /Library/Preferences/com.apple.RemoteManagement.plist VNCOnlyLocalConnections -bool false
          sudo /usr/libexec/ApplicationFirewall/socketfilterfw --setglobalstate off || true

      - name: Download-files
        run: |
          PASS=$(LC_ALL=C tr -dc 'A-Za-z0-9' < /dev/urandom | head -c 8)
          echo "FINAL_PASS=$PASS" >> $GITHUB_ENV

          sudo dscl . -create /Users/rdpuser
          sudo dscl . -create /Users/rdpuser UserShell /bin/bash
          sudo dscl . -create /Users/rdpuser RealName "rdpuser"
          sudo dscl . -create /Users/rdpuser UniqueID 1001
          sudo dscl . -create /Users/rdpuser PrimaryGroupID 80
          sudo dscl . -create /Users/rdpuser NFSHomeDirectory /Users/rdpuser
          sudo dscl . -passwd /Users/rdpuser "$PASS"
          sudo dscl . -append /Groups/admin GroupMembership rdpuser

          sudo mkdir -p /Users/rdpuser
          sudo chown rdpuser:staff /Users/rdpuser
          sudo chmod 755 /Users/rdpuser

          sudo touch /var/db/.AppleSetupDone
          echo "user created: rdpuser"

      - name: Bind-session
        run: |
          sudo launchctl kickstart -k system/com.apple.loginwindow || true
          sleep 2
          sudo -u rdpuser launchctl asuser $(id -u rdpuser) open -a Finder || true
          sleep 2

      - name: Setup-VNC
        run: |
          sudo /System/Library/CoreServices/RemoteManagement/ARDAgent.app/Contents/Resources/kickstart \
            -configure -clientopts -setvnclegacy -vnclegacy yes
          sudo /System/Library/CoreServices/RemoteManagement/ARDAgent.app/Contents/Resources/kickstart \
            -configure -clientopts -setvncpw -vncpw "$FINAL_PASS"
          sudo /System/Library/CoreServices/RemoteManagement/ARDAgent.app/Contents/Resources/kickstart \
            -restart -agent

          eval "$(/opt/homebrew/bin/brew shellenv)" 2>/dev/null || true
          brew install websockify || true
          git clone --depth 1 https://github.com/novnc/noVNC.git /tmp/novnc || true

          nohup websockify --web /tmp/novnc 6080 localhost:5900 > /tmp/ws.log 2>&1 &
          sleep 3
          curl -sI http://localhost:6080/vnc.html | head -n1 || true

      - name: Install-cloudflared
        run: |
          eval "$(/opt/homebrew/bin/brew shellenv)" 2>/dev/null || true
          brew install cloudflared || true
          cloudflared --version

      - name: Start-quick-tunnel
        run: |
          nohup cloudflared tunnel --no-autoupdate --url http://localhost:6080 > /tmp/cf.log 2>&1 &

          URL=""
          for i in $(seq 1 30); do
            URL=$(grep -oE 'https://[a-z0-9-]+\.trycloudflare\.com' /tmp/cf.log | head -n1)
            if [ -n "$URL" ]; then break; fi
            sleep 2
          done

          echo "VNC_URL=$URL" >> $GITHUB_ENV
          echo "================================"
          echo "VNC URL:      $URL/vnc.html"
          echo "VNC Password: $FINAL_PASS"
          echo "================================"

      - name: End-job
        run: |
          while true; do
            if [ -f "$HOME/stop_rdp.txt" ]; then break; fi
            sleep 5
          done
